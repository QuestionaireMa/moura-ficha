<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squadl · Questionário de hoje</title>
<meta property="og:title" content="Squadl · Questionário de hoje">
<meta property="og:description" content="Toca para abrir o Squadl e responder. Leva 30 segundos.">
<style>
  :root{--bg:#0b0f14;--card:#141a22;--text:#f3f5f8;--muted:#9aa4b2;--accent:#3b82f6;--line:#232b36}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
  main{width:100%;max-width:420px;text-align:center}
  .ball{font-size:52px;margin-bottom:8px}
  h1{font-size:26px;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 22px}
  a.btn{display:block;padding:16px;border-radius:14px;background:var(--accent);color:#fff;
    text-decoration:none;font-weight:700;font-size:18px;margin-bottom:26px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:left}
  .card h2{font-size:15px;margin:0 0 10px}
  .card a{display:flex;justify-content:space-between;color:var(--text);text-decoration:none;
    padding:12px 0;border-top:1px solid var(--line)}
  .card a span{color:var(--accent)}
  small{display:block;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<main>
  <div class="ball">⚽</div>
  <h1>Questionário de hoje</h1>
  <p>Toca no botão para abrir o Squadl. Leva 30 segundos.</p>
  <a class="btn" href="scout://checkin">Abrir o Squadl</a>
  <div class="card">
    <h2>Ainda não tens a app?</h2>
    <a href="https://apps.apple.com/app/id6792286071">iPhone <span>App Store ›</span></a>
    <a href="https://expo.dev/artifacts/eas/z4i4nXjIrycPLWAjypup7qkOUbKrvbgeQJDuWvvw4MM.apk">Android <span>Descarregar ›</span></a>
  </div>
  <small>Entra com o código que o treinador te deu.</small>
</main>
<script>
  // Try the app straight away; the button stays for when the browser asks first.
  setTimeout(function(){ location.href = 'scout://checkin'; }, 300);
</script>
</body>
</html>
